global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "auth-service"
    static_configs:
      - targets: ["auth-service:3001"]
    metrics_path: /metrics

  - job_name: "client-service"
    static_configs:
      - targets: ["client-service:3002"]
    metrics_path: /metrics
