global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: /metrics

  - job_name: 'client-service'
    static_configs:
      - targets: ['client-service:3002']
    metrics_path: /metrics

  - job_name: 'engagement-service'
    static_configs:
      - targets: ['engagement-service:3003']
    metrics_path: /metrics

  - job_name: 'report-service'
    static_configs:
      - targets: ['report-service:3004']
    metrics_path: /metrics

  - job_name: 'billing-service'
    static_configs:
      - targets: ['billing-service:3005']
    metrics_path: /metrics

  - job_name: 'bff-service'
    static_configs:
      - targets: ['bff-service:3007']
    metrics_path: /metrics
