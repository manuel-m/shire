services:
  # ── Application Services ──────────────────────────────────────────

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - AUTH_SERVICE_PORT=3001
      - MONGODB_URI=mongodb://admin:${MONGO_PASSWORD:-password}@mongodb:27017/shire-auth?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_IN_DAYS=7
      - BCRYPT_ROUNDS=12
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shire-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
        tag: 'auth-service'

  client-service:
    build:
      context: ..
      dockerfile: services/client-service/Dockerfile
    ports:
      - '3002:3002'
    environment:
      - CLIENT_SERVICE_PORT=3002
      - MONGODB_URI=mongodb://admin:${MONGO_PASSWORD:-password}@mongodb:27017/shire-client?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:-change-me-in-production}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shire-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
        tag: 'client-service'

  engagement-service:
    build:
      context: ..
      dockerfile: services/engagement-service/Dockerfile
    ports:
      - '3003:3003'
    environment:
      - ENGAGEMENT_SERVICE_PORT=3003
      - MONGODB_URI=mongodb://admin:${MONGO_PASSWORD:-password}@mongodb:27017/shire-engagement?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CLIENT_SERVICE_URL=http://client-service:3002
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shire-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
        tag: 'engagement-service'

  report-service:
    build:
      context: ..
      dockerfile: services/report-service/Dockerfile
    ports:
      - '3004:3004'
    environment:
      - REPORT_SERVICE_PORT=3004
      - MONGODB_URI=mongodb://admin:${MONGO_PASSWORD:-password}@mongodb:27017/shire-report?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ENGAGEMENT_SERVICE_URL=http://engagement-service:3003
      - CLIENT_SERVICE_URL=http://client-service:3002
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shire-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
        tag: 'report-service'

  billing-service:
    build:
      context: ..
      dockerfile: services/billing-service/Dockerfile
    ports:
      - '3005:3005'
    environment:
      - BILLING_SERVICE_PORT=3005
      - MONGODB_URI=mongodb://admin:${MONGO_PASSWORD:-password}@mongodb:27017/shire-billing?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CLIENT_SERVICE_URL=http://client-service:3002
      - ENGAGEMENT_SERVICE_URL=http://engagement-service:3003
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shire-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
        tag: 'billing-service'

  bff-service:
    build:
      context: ..
      dockerfile: services/bff-service/Dockerfile
    ports:
      - '3007:3007'
    environment:
      - BFF_SERVICE_PORT=3007
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CLIENT_SERVICE_URL=http://client-service:3002
      - ENGAGEMENT_SERVICE_URL=http://engagement-service:3003
      - REPORT_SERVICE_URL=http://report-service:3004
      - BILLING_SERVICE_URL=http://billing-service:3005
    depends_on:
      - auth-service
      - client-service
      - engagement-service
      - report-service
      - billing-service
    networks:
      - shire-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
        tag: 'bff-service'

  # ── Database ───────────────────────────────────────────────────────

  mongodb:
    image: mongo:7
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
    volumes:
      - mongodb-data:/data/db
    networks:
      - shire-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'mongosh',
          '-u',
          'admin',
          '-p',
          '${MONGO_PASSWORD:-password}',
          '--authenticationDatabase',
          'admin',
          '--eval',
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observability ──────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - shire-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    ports:
      - '3101:3100'
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - shire-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.3.0
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - shire-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - '3100:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - shire-network
    restart: unless-stopped

networks:
  shire-network:
    driver: bridge

volumes:
  mongodb-data:
  prometheus-data:
  loki-data:
  grafana-data:
