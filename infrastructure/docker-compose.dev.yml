# Development overrides — mounts source code, uses tsx for hot-reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
      target: base
    command: pnpm --filter @shire/auth-service dev
    volumes:
      - ../packages/shared-types/src:/app/packages/shared-types/src:ro
      - ../services/auth-service/src:/app/services/auth-service/src:ro
    environment:
      - BCRYPT_ROUNDS=4

  client-service:
    build:
      context: ..
      dockerfile: services/client-service/Dockerfile
      target: base
    command: pnpm --filter @shire/client-service dev
    volumes:
      - ../packages/shared-types/src:/app/packages/shared-types/src:ro
      - ../services/client-service/src:/app/services/client-service/src:ro

  engagement-service:
    build:
      context: ..
      dockerfile: services/engagement-service/Dockerfile
      target: base
    command: pnpm --filter @shire/engagement-service dev
    volumes:
      - ../packages/shared-types/src:/app/packages/shared-types/src:ro
      - ../services/engagement-service/src:/app/services/engagement-service/src:ro

  report-service:
    build:
      context: ..
      dockerfile: services/report-service/Dockerfile
      target: base
    command: pnpm --filter @shire/report-service dev
    volumes:
      - ../packages/shared-types/src:/app/packages/shared-types/src:ro
      - ../services/report-service/src:/app/services/report-service/src:ro

  billing-service:
    build:
      context: ..
      dockerfile: services/billing-service/Dockerfile
      target: base
    command: pnpm --filter @shire/billing-service dev
    volumes:
      - ../packages/shared-types/src:/app/packages/shared-types/src:ro
      - ../services/billing-service/src:/app/services/billing-service/src:ro

  bff-service:
    build:
      context: ..
      dockerfile: services/bff-service/Dockerfile
      target: base
    command: pnpm --filter @shire/bff-service dev
    volumes:
      - ../packages/shared-types/src:/app/packages/shared-types/src:ro
      - ../services/bff-service/src:/app/services/bff-service/src:ro

  mongodb:
    ports:
      - '27017:27017'

  compass:
    image: haohanyang/compass-web
    container_name: compass-web
    ports:
      - '8080:8080'
    environment:
      CW_MONGO_URI: mongodb://admin:${MONGO_PASSWORD:-password}@mongodb:27017/?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - shire-network
